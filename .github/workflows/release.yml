name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Preview curated notes in the release PR
        if: steps.release.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          number=$(gh pr list --state open --base main --head release-please--branches--main --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            exit 0
          fi
          branch=$(gh pr view "$number" --json headRefName --jq .headRefName)
          version=$(gh api "repos/${GH_REPO}/contents/version.txt?ref=${branch}" --jq .content | base64 --decode)
          notes="doc/releases/v${version}.md"
          if [ -f "$notes" ]; then
            gh pr view "$number" --json body --jq .body > "$RUNNER_TEMP/release-pr-original.md"
            python3 - "$notes" "$RUNNER_TEMP" <<'PY'
          import pathlib, re, sys
          notes, temporary = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          body = (temporary / "release-pr-original.md").read_text()
          start, end = "<!-- namu-release-notes:start -->", "<!-- namu-release-notes:end -->"
          body = re.sub(re.escape(start) + r".*?" + re.escape(end) + r"\s*", "", body, flags=re.S)
          summary = f"{start}\n### Release highlights\n\n{notes.read_text().strip()}\n{end}\n\n"
          (temporary / "release-pr-body.md").write_text(summary + body)
          PY
            gh pr edit "$number" --body-file "$RUNNER_TEMP/release-pr-body.md"
          fi

      - name: Use curated release notes when available
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          notes="doc/releases/${RELEASE_TAG}.md"
          if [ -f "$notes" ]; then
            gh release edit "$RELEASE_TAG" --notes-file "$notes"
          fi
